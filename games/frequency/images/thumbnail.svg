<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ffc93c;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#06d6a0;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="150" fill="url(#bg)"/>

  <!-- Sound waves -->
  <g stroke="url(#wave)" stroke-width="2" fill="none" opacity="0.9">
    <circle cx="70" cy="50" r="20"/>
    <circle cx="70" cy="50" r="35"/>
    <circle cx="70" cy="50" r="50"/>

    <circle cx="130" cy="100" r="15"/>
    <circle cx="130" cy="100" r="30"/>
    <circle cx="130" cy="100" r="45"/>
  </g>

  <!-- Sparkles -->
  <g fill="white" opacity="0.8">
    <circle cx="40" cy="30" r="1.5"/>
    <circle cx="160" cy="40" r="1"/>
    <circle cx="180" cy="80" r="1.5"/>
    <circle cx="20" cy="120" r="1"/>
  </g>

  <!-- Title -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="white" opacity="0.9">Frequency</text>
</svg>
