<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky background -->
  <defs>
    <radialGradient id="skyGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </radialGradient>

    <!-- Star glow filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Meteor trail filter -->
    <filter id="meteorTrail" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>

  <!-- Background stars -->
  <circle cx="50" cy="60" r="0.5" fill="rgba(255,255,255,0.6)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="40" r="0.5" fill="rgba(255,255,255,0.4)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="80" r="0.5" fill="rgba(255,255,255,0.5)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main constellation pattern -->
  <!-- Star 1 (White) -->
  <g filter="url(#starGlow)">
    <circle cx="150" cy="120" r="4" fill="#ffffff">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Star cross pattern -->
    <line x1="150" y1="115" x2="150" y2="125" stroke="#ffffff" stroke-width="0.5" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="145" y1="120" x2="155" y2="120" stroke="#ffffff" stroke-width="0.5" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Star 2 (Blue) -->
  <g filter="url(#starGlow)">
    <circle cx="220" cy="140" r="3.5" fill="#3b82f6">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Star 3 (Gold) -->
  <g filter="url(#starGlow)">
    <circle cx="180" cy="180" r="4.5" fill="#fbbf24">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Star 4 (Purple) -->
  <g filter="url(#starGlow)">
    <circle cx="280" cy="160" r="3" fill="#6b46c1">
      <animate attributeName="r" values="2;4;2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Star 5 (Green) -->
  <g filter="url(#starGlow)">
    <circle cx="250" cy="200" r="3.8" fill="#10b981">
      <animate attributeName="r" values="2.8;4.8;2.8" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Constellation connections -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none">
    <!-- Connection 1-2 -->
    <line x1="150" y1="120" x2="220" y2="140">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- Connection 2-4 -->
    <line x1="220" y1="140" x2="280" y2="160">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <!-- Connection 1-3 -->
    <line x1="150" y1="120" x2="180" y2="180">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <!-- Connection 4-5 -->
    <line x1="280" y1="160" x2="250" y2="200">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Meteor streak -->
  <g filter="url(#meteorTrail)" opacity="0.8">
    <line x1="320" y1="50" x2="360" y2="90" stroke="#ffffff" stroke-width="2">
      <animate attributeName="x1" values="280;360;280" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="30;110;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;380;300" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="50;130;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.4;0" dur="6s" repeatCount="indefinite"/>
    </line>
    <circle r="2" fill="#ffffff">
      <animateMotion dur="6s" repeatCount="indefinite"
                     path="M 280,30 L 380,130 M 280,30"/>
      <animate attributeName="opacity" values="0;1;0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Stardust particles -->
  <g opacity="0.6">
    <circle cx="160" cy="130" r="1" fill="#ffffff">
      <animate attributeName="cx" values="160;165;158" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;135;128" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="150" r="0.8" fill="#3b82f6">
      <animate attributeName="cx" values="200;195;205" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;145;155" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="170" r="1.2" fill="#fbbf24">
      <animate attributeName="cx" values="260;258;262" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;175;165" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
        text-anchor="middle" fill="#ffffff" opacity="0.9">
    🌙 Constellation Canvas
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="12"
        text-anchor="middle" fill="rgba(255,255,255,0.8)">
    Paint the stars • Create celestial music
  </text>
</svg>
