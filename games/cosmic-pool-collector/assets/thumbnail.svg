<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cosmic space background -->
  <defs>
    <radialGradient id="cosmicBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" style="stop-color:#1e1e3f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000014;stop-opacity:1" />
    </radialGradient>

    <!-- Cosmic glow filter -->
    <filter id="cosmicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Particle trail filter -->
    <filter id="particleTrail" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#cosmicBg)"/>

  <!-- Distant stars -->
  <g opacity="0.6">
    <circle cx="50" cy="40" r="0.5" fill="white">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="30" r="0.5" fill="white">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="50" r="0.5" fill="white">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="80" r="0.5" fill="white">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Cosmic treasures floating -->
  <!-- Crystal -->
  <g filter="url(#cosmicGlow)">
    <polygon points="150,120 160,110 170,120 160,130" fill="#00ffff">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- Crystal sparkles -->
    <circle cx="160" cy="120" r="8" stroke="#00ffff" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Cosmic orb -->
  <g filter="url(#cosmicGlow)">
    <circle cx="250" cy="160" r="8" fill="#ff69b4">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; 5,0; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Orb energy rings -->
    <circle cx="250" cy="160" r="12" stroke="#ff69b4" stroke-width="1" fill="none" opacity="0.4">
      <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Star fragment -->
  <g filter="url(#cosmicGlow)">
    <polygon points="300,140 310,145 305,155 295,150" fill="#ffd700">
      <animateTransform attributeName="transform" type="rotate"
                       values="0 300 145; 360 300 145; 0 300 145" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Nebula gas -->
  <g filter="url(#cosmicGlow)">
    <circle cx="100" cy="180" r="15" fill="#9932cc" opacity="0.3">
      <animate attributeName="r" values="15;20;15" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="200" r="12" fill="#4169e1" opacity="0.4">
      <animate attributeName="r" values="12;16;12" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Particle effects -->
  <g filter="url(#particleTrail)">
    <!-- Floating particles -->
    <circle cx="180" cy="100" r="1" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; 10,-5; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="180" r="1.5" fill="#00ffff">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; -8,3; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="120" r="1" fill="#ff69b4">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; 6,8; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Cosmic pool ripple effect -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none">
    <circle cx="200" cy="150" r="50" opacity="0.3">
      <animate attributeName="r" values="50;80;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="150" r="70" opacity="0.2">
      <animate attributeName="r" values="70;100;70" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#ffffff" opacity="0.9">
    ✨ Cosmic Pool Collector
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="rgba(255,255,255,0.8)">
    Collect cosmic treasures • Unlock universe mysteries
  </text>
</svg>
