<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Garden background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#98fb98;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>

    <!-- Plant glow filter -->
    <filter id="plantGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bug trail filter -->
    <filter id="bugTrail" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>

  <!-- Garden rows -->
  <g>
    <!-- Soil rows -->
    <rect x="0" y="200" width="400" height="20" fill="#654321"/>
    <rect x="0" y="230" width="400" height="20" fill="#654321"/>
    <rect x="0" y="260" width="400" height="40" fill="#8b4513"/>
  </g>

  <!-- Tomato plants to defend -->
  <g>
    <!-- Tomato plant 1 -->
    <rect x="78" y="180" width="4" height="40" fill="#228b22"/>
    <circle cx="80" cy="180" r="8" fill="#ff6347"/>
    <text x="80" y="185" font-size="12" text-anchor="middle">🍅</text>

    <!-- Tomato plant 2 -->
    <rect x="148" y="175" width="4" height="45" fill="#228b22"/>
    <circle cx="150" cy="175" r="8" fill="#ff6347"/>
    <text x="150" y="180" font-size="12" text-anchor="middle">🍅</text>

    <!-- Tomato plant 3 -->
    <rect x="298" y="180" width="4" height="40" fill="#228b22"/>
    <circle cx="300" cy="180" r="8" fill="#ff6347"/>
    <text x="300" y="185" font-size="12" text-anchor="middle">🍅</text>
  </g>

  <!-- Defensive plants -->
  <g filter="url(#plantGlow)">
    <!-- Marigold -->
    <circle cx="120" cy="210" r="3" fill="#228b22"/>
    <rect x="118" y="210" width="4" height="15" fill="#228b22"/>
    <text x="120" y="205" font-size="16" text-anchor="middle">🌼</text>
    <circle cx="120" cy="210" r="25" stroke="#ffd700" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Basil -->
    <circle cx="200" cy="235" r="3" fill="#228b22"/>
    <rect x="198" y="235" width="4" height="15" fill="#228b22"/>
    <text x="200" y="230" font-size="16" text-anchor="middle">🌿</text>
    <circle cx="200" cy="235" r="30" stroke="#90ee90" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Lavender -->
    <circle cx="260" cy="215" r="3" fill="#228b22"/>
    <rect x="258" y="215" width="4" height="15" fill="#228b22"/>
    <text x="260" y="210" font-size="16" text-anchor="middle">💜</text>
    <circle cx="260" cy="215" r="28" stroke="#dda0dd" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Incoming bugs -->
  <g filter="url(#bugTrail)">
    <!-- Bug 1 -->
    <circle cx="50" cy="120" r="4" fill="#90ee90">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; 30,60; 0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="50" y="125" font-size="12" text-anchor="middle">🐛</text>

    <!-- Bug 2 -->
    <circle cx="350" cy="100" r="4" fill="#32cd32">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; -50,80; 0,0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="105" font-size="12" text-anchor="middle">🪲</text>

    <!-- Bug 3 -->
    <circle cx="30" cy="140" r="4" fill="#ffff00">
      <animateTransform attributeName="transform" type="translate"
                       values="0,0; 40,50; 0,0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="145" font-size="12" text-anchor="middle">🐝</text>
  </g>

  <!-- Seed trajectory (like Missile Command) -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none" stroke-dasharray="5,5">
    <path d="M 100 50 Q 140 100 180 150">
      <animate attributeName="stroke-dashoffset" values="0;-20;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="100" cy="50" r="2" fill="#ffd700">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 0,0 Q 40,50 80,100"/>
    </circle>
  </g>

  <!-- Garden defense effects -->
  <g opacity="0.6">
    <!-- Effect particles -->
    <circle cx="130" cy="200" r="1" fill="#ffd700">
      <animate attributeName="cx" values="130;135;125" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;195;205" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="225" r="1.5" fill="#90ee90">
      <animate attributeName="cx" values="210;205;215" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="225;220;230" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="205" r="1" fill="#dda0dd">
      <animate attributeName="cx" values="270;275;265" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="205;200;210" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Growth indicators -->
  <g>
    <!-- Growing seed -->
    <circle cx="320" cy="230" r="2" fill="#8b4513">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="230" r="8" stroke="rgba(34,139,34,0.5)" stroke-width="1" fill="none">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#228b22" opacity="0.9">
    🌱 Garden Defender
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="rgba(34,139,34,0.8)">
    Plant strategic defenses • Time like Missile Command
  </text>
</svg>
